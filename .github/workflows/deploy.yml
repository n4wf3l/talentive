name: Deploy Talentive to one.com

on:
  push:
    branches: ["main"]
  workflow_dispatch: # allow manual re-deploy from the Actions tab

concurrency:
  group: "deploy-onecom"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Fix bin permissions
        run: chmod +x node_modules/.bin/vite node_modules/.bin/tsc 2>/dev/null || true

      - name: Cache Puppeteer Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Ensure Chromium is installed for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Build (vite + image optim + prerender)
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # Mirror dist/ → one.com /www/ over SFTP.
      # `mirror -R` = reverse mirror (local → remote).
      # `--delete` = drop remote files no longer in dist/ (keeps /www/ clean).
      # `--parallel=5` = 5 concurrent transfers, big speed win on ~30-40 files.
      # `--exclude .well-known/` = leave any ACME/webmaster verifications alone.
      # DEBUG: print the remote layout so we can lock in SFTP_REMOTE_PATH.
      # one.com's SFTP home is not always /www/ — sometimes it's a per-domain
      # subdir like talentivegroup.com/files/. This step lists what's there
      # so we can set the secret to the right value.
      - name: Deploy dist/ to one.com via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:timeout 30;
            open -u '$SFTP_USER','$SFTP_PASSWORD' sftp://$SFTP_HOST;
            mirror -R --delete --parallel=5 --exclude-glob='.well-known/' --verbose dist/ $SFTP_REMOTE_PATH;
          "

      - name: Summary
        run: |
          echo "Deployed to one.com — https://talentivegroup.com should be live." >> $GITHUB_STEP_SUMMARY
          echo "Files uploaded from ./dist/ to ${{ secrets.SFTP_REMOTE_PATH }}." >> $GITHUB_STEP_SUMMARY
